# MiniTSDB 配置文件
# 使用方式: ./minitsdb -c minitsdb.conf

[log]
# 日志文件目录（默认 ./logs）
directory = ./logs

# 日志级别: trace, debug, info, warn, error（默认 info）
level = info

# 保留的滚动日志文件数（默认 1000）
keep_files = 1000

[storage]
# 数据存储根目录（默认 ./data）
data_dir = ./data

# 热数据保留天数（默认 90）
hot_retention_days = 90

# 冷数据保留天数（默认 730）
cold_retention_days = 730

# 外部归档路径（可选，留空不归档）
# archive_path = /mnt/cold_archive

# Compaction 检查间隔（秒，默认 300）
compact_interval_sec = 300

[server]
# gRPC 服务端口（默认 8086）
port = 8086
